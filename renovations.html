<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Work — Drummond Bathroom Renovations</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F5EFE6;--slate:#2B3A4A;--terra:#BF7B5E;--sage:#6E9B8C;--dark:#1A2430;--mid:#1e2d3d}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:white;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
::-webkit-scrollbar-thumb{background:var(--terra);border-radius:2px}

/* ── NAV ── */
nav{flex-shrink:0;padding:0 2.5rem;height:62px;display:flex;align-items:center;justify-content:space-between;background:rgba(26,36,48,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);z-index:200}
.nav-logo{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--cream);text-decoration:none;opacity:.9}
.nav-right{display:flex;align-items:center;gap:1.2rem}
.nav-back{color:rgba(255,255,255,.4);text-decoration:none;font-size:.8rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;transition:color .2s}
.nav-back:hover{color:var(--terra)}
.nav-cta{background:var(--terra);color:white;padding:.45rem 1.2rem;border-radius:100px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.83rem;text-decoration:none;transition:background .2s}
.nav-cta:hover{background:#a86445}

/* ── MAIN LAYOUT ── */
.page-body{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── SHARED HEADER ── */
.page-header{flex-shrink:0;padding:2.5rem 3rem 0;background:var(--dark);border-bottom:1px solid rgba(255,255,255,.06)}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-bottom:.6rem}
.page-header h1{font-family:'DM Serif Display',serif;font-size:clamp(2.2rem,4vw,3.5rem);line-height:1.08;color:white;letter-spacing:-.02em;margin-bottom:.4rem}
.page-header h1 em{color:var(--terra);font-style:italic}
.page-header p{font-size:.95rem;color:rgba(255,255,255,.4);line-height:1.6;max-width:480px;margin-bottom:1.5rem}

/* ── TABS ── */
.tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.07)}
.tab{padding:.65rem 1.8rem;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;color:rgba(255,255,255,.35);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.02em;position:relative;top:1px}
.tab:hover{color:rgba(255,255,255,.65)}
.tab.active{color:white;border-bottom-color:var(--terra)}

/* ── TAB PANELS ── */
.tab-panels{flex:1;overflow:hidden;display:flex;flex-direction:column}
.panel{display:none;flex:1;overflow:hidden;flex-direction:column}
.panel.active{display:flex}

/* ══════════════════════════════════
   RENOVATIONS PANEL
══════════════════════════════════ */
.reno-scroll{flex:1;overflow-y:auto;padding:2.5rem 3rem 4rem}
.job{padding:2.5rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.job:last-child{border-bottom:none}
.job:first-child{padding-top:0}
.job-meta-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.6rem;margin-bottom:1.4rem}
.job-title{font-family:'DM Serif Display',serif;font-size:clamp(1.3rem,2.5vw,2rem);color:white;letter-spacing:-.01em}
.job-subtitle{font-size:.75rem;color:rgba(255,255,255,.3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
.photo-row{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:var(--terra) rgba(255,255,255,.06)}
.photo-row::-webkit-scrollbar{height:3px}
.photo-row::-webkit-scrollbar-thumb{background:var(--terra);border-radius:2px}
.photo-thumb{flex:0 0 auto;width:260px;height:195px;border-radius:10px;overflow:hidden;cursor:pointer;scroll-snap-align:start;background:rgba(255,255,255,.04);position:relative}
.photo-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s cubic-bezier(.22,1,.36,1),filter .3s;filter:brightness(.88)}
.photo-thumb:hover img{transform:scale(1.04);filter:brightness(1)}
.photo-reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.photo-reveal.visible{opacity:1;transform:none}
.reno-empty{text-align:center;padding:5rem 2rem;color:rgba(255,255,255,.2)}
.reno-empty h2{font-family:'DM Serif Display',serif;font-size:1.8rem;margin-bottom:.6rem}

/* ══════════════════════════════════
   SERVICE AREA PANEL
══════════════════════════════════ */
.map-panel{flex:1;display:grid;grid-template-columns:320px 1fr;overflow:hidden;padding-top:1.2rem}
.map-sidebar{overflow-y:auto;padding:2rem 1.5rem;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:1.2rem}
.stat-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:.75rem 1rem}
.stat-v{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--terra);line-height:1}
.stat-l{font-size:.62rem;color:rgba(255,255,255,.3);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-top:.15rem}
.chips-label{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:.45rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:100px;padding:.22rem .7rem;font-size:.74rem;color:rgba(255,255,255,.45);cursor:pointer;transition:all .2s}
.chip.active{background:rgba(191,123,94,.18);border-color:rgba(191,123,94,.5);color:var(--terra)}
.chip.loading{animation:chipPulse 1.2s ease-in-out infinite}
.map-cta{background:var(--terra);color:white;border:none;border-radius:12px;padding:.8rem 1rem;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none;display:block;text-align:center;transition:background .2s;margin-top:auto}
.map-cta:hover{background:#a86445}
#map{width:100%;height:100%}

/* Leaflet overrides */
.leaflet-tooltip{background:rgba(20,30,42,.97);border:1px solid rgba(255,255,255,.12);color:white;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;padding:.3rem .7rem;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.leaflet-tooltip::before{display:none}
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom a{background:rgba(26,36,48,.9)!important;color:white!important;border-color:rgba(255,255,255,.1)!important}
.leaflet-control-zoom a:hover{background:rgba(191,123,94,.4)!important}
.dot-marker{border-radius:50%;background:var(--terra);border:2.5px solid white;box-shadow:0 0 0 4px rgba(191,123,94,.25),0 2px 10px rgba(0,0,0,.5);transition:all .25s}
.dot-sm{width:11px;height:11px}
.dot-lg{width:20px;height:20px;border-width:3px;box-shadow:0 0 0 6px rgba(191,123,94,.3),0 4px 18px rgba(0,0,0,.6)}

/* ── LIGHTBOX ── */
.lightbox{position:fixed;inset:0;background:rgba(10,16,24,.96);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column}
.lightbox.open{display:flex;animation:fadeIn .22s ease}
.lb-img{max-width:92vw;max-height:84vh;object-fit:contain;border-radius:6px;transition:opacity .2s ease}
.lb-btn{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.lb-btn:hover{background:rgba(255,255,255,.2);color:white}
.lb-close{position:absolute;top:16px;right:16px;width:38px;height:38px;font-size:1.1rem}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;font-size:1.5rem}
.lb-prev{left:16px}.lb-next{right:16px}
.lb-counter{margin-top:1.1rem;font-size:.73rem;color:rgba(255,255,255,.28);letter-spacing:.1em}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes chipPulse{0%,100%{opacity:.35}50%{opacity:.85}}

/* ── MOBILE ── */
@media(max-width:700px){
  .page-header{padding:1.5rem 1.2rem 0}
  .reno-scroll{padding:1.5rem 1.2rem 3rem}
  .photo-thumb{width:200px;height:150px}
  .map-panel{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .map-sidebar{border-right:none;border-bottom:1px solid rgba(255,255,255,.06);padding:1rem;max-height:200px;overflow-y:auto}
  .map-sidebar h2{display:none}
  #map{min-height:300px}
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="./index.html">🛁 Drummond Bathroom Renovations</a>
  <div class="nav-right">
    <a href="./index.html" class="nav-back">← Back</a>
    <a href="./index.html" class="nav-cta">Get a Quote</a>
  </div>
</nav>

<div class="page-body">

  <!-- Shared header -->
  <div class="page-header">
    <div class="eyebrow">Drummond Bathroom Renovations</div>
    <h1>Our work,<br>our <em>reach.</em></h1>
    <p>Browse completed renovations and see where Luke has worked across South Australia.</p>
    <div class="tabs">
      <button class="tab active" id="tab-reno" onclick="switchTab('reno')">Previous Renovations</button>
      <button class="tab" id="tab-map" onclick="switchTab('map')">Service Area</button>
    </div>
  </div>

  <div class="tab-panels">

    <!-- ── RENOVATIONS PANEL ── -->
    <div class="panel active" id="panel-reno">
      <div class="reno-scroll" id="renoScroll">
        <div class="reno-empty"><h2>Loading…</h2></div>
      </div>
    </div>

    <!-- ── SERVICE AREA PANEL ── -->
    <div class="panel" id="panel-map">
      <div class="map-panel">
        <aside class="map-sidebar">
          <div>
            <div class="chips-label" style="font-size:.7rem;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem">Where we work</div>
            <p style="font-size:.82rem;color:rgba(255,255,255,.35);line-height:1.5;margin-bottom:.8rem">Tap a suburb to zoom in on the map.</p>
          </div>
          <div class="stat-box">
            <div class="stat-v" id="statCount">—</div>
            <div class="stat-l">Suburbs served</div>
          </div>
          <div>
            <div class="chips-label">Areas</div>
            <div class="chips" id="chips"></div>
          </div>
          <a href="./index.html" class="map-cta">Get a Free Quote</a>
        </aside>
        <div id="map"></div>
      </div>
    </div>

  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <button class="lb-btn lb-close" onclick="lbClose()">✕</button>
  <button class="lb-btn lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
  <img class="lb-img" id="lbImg" src="" alt="">
  <button class="lb-btn lb-nav lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// JOBS — add your renos here
// Images: pastRenos/{id}-1.jpg, -2.jpg etc.
// ═══════════════════════════════════════════════════════
const JOBS = [
  { id: 'smithfield-plains-bathroom-toilet', title: 'Smithfield Plains Bathroom', subtitle: 'Smithfield Plains · 2025' },
  // { id: 'brighton-ensuite', title: 'Brighton Ensuite', subtitle: 'Brighton SA · 2025' },
];

// ═══════════════════════════════════════════════════════
// SUBURBS — add/remove as needed
// ═══════════════════════════════════════════════════════
const SUBURBS = [
  "Palmer","Bedford Park","Sturt","Strathalbyn","Smithfield Plains",
  "Huntfield Heights","Underdale","Pooraka","Kensington Gardens",
  "Mawson Lakes","Forreston","Meadows","Para Vista","Oakden",
  "Kilburn","Plympton","Banksia Park","Kapunda","Sheidow Park",
  "Findon","Gulfview Heights",
];

// ── Tab switching ─────────────────────────────────────
let mapInited = false;
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  // Map loads in background — just fix size when panel becomes visible
  if (tab === 'map' && window._leafletMap) {
    setTimeout(() => window._leafletMap.invalidateSize(), 50);
  }
}

// ══════════════════════════════════════════════════════
// RENOVATIONS
// ══════════════════════════════════════════════════════
const IMG_BASE = './pastRenos/';
const IMG_EXTS = ['.jpg','.jpeg','.png','.webp'];

function probeImages(id) {
  return new Promise(resolve => {
    const found = [];
    function tryNext(n) {
      if (n > 20) { resolve(found); return; }
      let ei = 0;
      function tryExt() {
        if (ei >= IMG_EXTS.length) { found.length > 0 ? resolve(found) : tryNext(n + 1); return; }
        const src = IMG_BASE + id + '-' + n + IMG_EXTS[ei];
        const img = new Image();
        img.onload = () => { found.push(src); tryNext(n + 1); };
        img.onerror = () => { ei++; tryExt(); };
        img.src = src;
      }
      tryExt();
    }
    tryNext(1);
  });
}

async function loadRenos() {
  const container = document.getElementById('renoScroll');
  if (!JOBS.length) {
    container.innerHTML = '<div class="reno-empty"><h2>Coming Soon</h2><p style="color:rgba(255,255,255,.25);margin-top:.5rem">Renovations will appear here once added.</p></div>';
    return;
  }
  container.innerHTML = '';
  const results = await Promise.all(JOBS.map(async j => ({ ...j, images: await probeImages(j.id) })));
  results.forEach(job => {
    if (!job.images.length) return;
    const sec = document.createElement('div');
    sec.className = 'job';
    sec.innerHTML =
      '<div class="job-meta-row">' +
        '<div class="job-title">' + job.title + '</div>' +
        (job.subtitle ? '<div class="job-subtitle">' + job.subtitle + '</div>' : '') +
      '</div>' +
      '<div class="photo-row"></div>';
    container.appendChild(sec);
    window._lbJobs = window._lbJobs || {};
    window._lbJobs[job.id] = job.images;
    const row = sec.querySelector('.photo-row');
    job.images.forEach((src, idx) => {
      const t = document.createElement('div');
      t.className = 'photo-thumb photo-reveal';
      t.innerHTML = '<img src="' + src + '" loading="lazy" alt="' + job.title + '" onerror="this.closest(\'.photo-thumb\').style.display=\'none\'">';
      t.addEventListener('click', () => lbOpen(job.id, idx));
      row.appendChild(t);
      setTimeout(() => revealObs.observe(t), idx * 50);
    });
  });
  if (!container.children.length)
    container.innerHTML = '<div class="reno-empty"><h2>No Photos Yet</h2></div>';
}

const revealObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); } });
}, { threshold: .1, rootMargin: '0px 0px -30px 0px' });

loadRenos();

// Auto-switch tab from URL hash
if (window.location.hash === '#map') switchTab('map');

// Start map loading in background immediately (so it's ready when tab is opened)
let mapIniting = false;
function maybeInitMap() {
  if (mapInited || mapIniting) return;
  mapIniting = true;
  initMap();
  mapInited = true;
}
// Begin background init after a short delay so renos load first
setTimeout(maybeInitMap, 1500);

// ── Lightbox ─────────────────────────────────────────
let _lbImgs = [], _lbIdx = 0;
function lbOpen(jobId, idx) {
  _lbImgs = (window._lbJobs || {})[jobId] || [];
  _lbIdx = idx; lbShow();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function lbShow() {
  const el = document.getElementById('lbImg'), ctr = document.getElementById('lbCounter');
  el.style.opacity = '0';
  setTimeout(() => { el.src = _lbImgs[_lbIdx]; el.style.opacity = '1'; }, 140);
  ctr.textContent = _lbImgs.length > 1 ? (_lbIdx + 1) + ' of ' + _lbImgs.length : '';
  document.querySelector('.lb-prev').style.visibility = _lbImgs.length > 1 ? '' : 'hidden';
  document.querySelector('.lb-next').style.visibility = _lbImgs.length > 1 ? '' : 'hidden';
}
function lbNav(dir) { if (_lbImgs.length < 2) return; _lbIdx = (_lbIdx + dir + _lbImgs.length) % _lbImgs.length; lbShow(); }
function lbClose() { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; }
document.getElementById('lightbox').addEventListener('click', e => { if (e.target === document.getElementById('lightbox')) lbClose(); });
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'Escape') lbClose();
});
let _swX = 0;
document.getElementById('lightbox').addEventListener('touchstart', e => { _swX = e.touches[0].clientX; }, { passive: true });
document.getElementById('lightbox').addEventListener('touchend', e => { const d = e.changedTouches[0].clientX - _swX; if (Math.abs(d) > 55) lbNav(d < 0 ? 1 : -1); });

// ══════════════════════════════════════════════════════
// SERVICE AREA MAP — only initialised when tab opened
// ══════════════════════════════════════════════════════
function initMap() {
  const map = L.map('map', { center: [-35.0, 138.75], zoom: 10, zoomControl: true, attributionControl: false });
  window._leafletMap = map;
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 19 }).addTo(map);

  document.getElementById('statCount').textContent = SUBURBS.length;
  const chipsEl = document.getElementById('chips');
  SUBURBS.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'chip loading';
    chip.textContent = name;
    chip.id = 'chip-' + name.replace(/\s+/g, '-');
    chipsEl.appendChild(chip);
  });

  const markerMap = {};

  function makeIcon(large) {
    const s = large ? 20 : 11;
    return L.divIcon({
      className: '',
      html: '<div class="dot-marker ' + (large ? 'dot-lg' : 'dot-sm') + '"></div>',
      iconSize: [s, s], iconAnchor: [s/2, s/2], tooltipAnchor: [s/2 + 4, 0],
    });
  }

  async function geocode(suburb) {
    // Check localStorage cache first
    const cacheKey = 'geo_' + suburb.replace(/\s+/g, '_');
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const [lat, lon] = JSON.parse(cached);
      return [lat, lon];
    }
    const res = await fetch(
      'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(suburb + ', South Australia, Australia') + '&format=json&limit=1&countrycodes=au',
      { headers: { 'User-Agent': 'DrummondBathroomsOurWork/1.0' } }
    );
    const data = await res.json();
    if (data?.[0]) {
      const pos = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
      try { localStorage.setItem(cacheKey, JSON.stringify(pos)); } catch {}
      return pos;
    }
    return null;
  }

  // Geocode with concurrency limit of 4 parallel requests
  async function geocodeAll(suburbs) {
    const results = new Array(suburbs.length).fill(null);
    const CONCURRENCY = 4;
    let idx = 0;
    async function worker() {
      while (idx < suburbs.length) {
        const i = idx++;
        try { results[i] = await geocode(suburbs[i]); } catch {}
        // Small delay only for non-cached requests (Nominatim rate limit)
        await new Promise(r => setTimeout(r, 280));
      }
    }
    await Promise.all(Array.from({ length: CONCURRENCY }, worker));
    return results;
  }

  (async () => {
    // Geocode all in parallel
    const positions = await geocodeAll(SUBURBS);
    const bounds = [];
    positions.forEach((pos, i) => {
      const suburb = SUBURBS[i];
      const chip = document.getElementById('chip-' + suburb.replace(/\s+/g, '-'));
      if (pos) {
        const marker = L.marker(pos, { icon: makeIcon(false) })
          .bindTooltip(suburb, { permanent: false, direction: 'right' })
          .addTo(map);
        markerMap[suburb] = { marker, pos };
        bounds.push(pos);
        if (chip) {
          chip.classList.remove('loading');
          chip.addEventListener('click', () => {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            Object.entries(markerMap).forEach(([n, { marker: m }]) => m.setIcon(makeIcon(n === suburb)));
            map.flyTo(pos, 13, { duration: 0.8 });
          });
        }
      } else {
        if (chip) { chip.classList.remove('loading'); chip.style.opacity = '.3'; }
      }
    });
    if (bounds.length > 1) map.fitBounds(bounds, { padding: [40, 40] });
    else if (bounds.length === 1) map.setView(bounds[0], 12);
  })();
}
</script>
</body>
</html>
