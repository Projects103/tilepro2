<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Work — Drummond Bathroom Renovations</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F5EFE6;--slate:#2B3A4A;--terra:#BF7B5E;--sage:#6E9B8C;
  --light:#EDE7DC;--dark:#1A2430;--off:#F9F6F1;
}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--cream);overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--dark)}::-webkit-scrollbar-thumb{background:var(--terra);border-radius:2px}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:0 2.5rem;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(26,36,48,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav-logo{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--cream);text-decoration:none;opacity:.9;transition:opacity .2s}
.nav-logo:hover{opacity:1}
.nav-back{color:rgba(255,255,255,.5);text-decoration:none;font-size:.82rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:color .2s;display:flex;align-items:center;gap:.4rem}
.nav-back:hover{color:var(--terra)}
.nav-cta{background:var(--terra);color:white;padding:.5rem 1.3rem;border-radius:100px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.83rem;text-decoration:none;transition:background .2s;letter-spacing:.02em}
.nav-cta:hover{background:#a86445}

/* ── HERO ── */
.reno-hero{padding:140px 2.5rem 80px;max-width:900px;margin:0 auto;border-bottom:1px solid rgba(255,255,255,.07)}
.reno-eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-bottom:1.2rem}
.reno-hero h1{font-family:'DM Serif Display',serif;font-size:clamp(2.8rem,5vw,5rem);line-height:1.05;color:white;margin-bottom:1.4rem;letter-spacing:-.02em}
.reno-hero h1 em{color:var(--terra);font-style:italic}
.reno-hero p{font-size:1.05rem;color:rgba(255,255,255,.5);max-width:480px;line-height:1.7}

/* ── JOBS ── */
main{max-width:1200px;margin:0 auto;padding:0 2rem 8rem}
.job{padding:5rem 0;border-bottom:1px solid rgba(255,255,255,.06)}
.job:last-child{border-bottom:none}
.job-meta-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.8rem;margin-bottom:2.5rem}
.job-title{font-family:'DM Serif Display',serif;font-size:clamp(1.6rem,3vw,2.4rem);color:white;letter-spacing:-.01em}
.job-subtitle{font-size:.8rem;color:rgba(255,255,255,.35);font-weight:500;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}

/* Masonry-style grid */
.photo-grid{columns:3;column-gap:.7rem}
.photo-grid.small{columns:2}
@media(max-width:900px){.photo-grid{columns:2}}
@media(max-width:500px){.photo-grid{columns:1}.photo-grid.small{columns:1}}
.photo-thumb{break-inside:avoid;margin-bottom:.7rem;border-radius:10px;overflow:hidden;cursor:pointer;position:relative;display:block;background:rgba(255,255,255,.04)}
.photo-thumb img{width:100%;height:auto;display:block;transition:transform .5s cubic-bezier(.22,1,.36,1),filter .3s ease;filter:brightness(.92)}
.photo-thumb:hover img{transform:scale(1.03);filter:brightness(1)}
.photo-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(26,36,48,.6));opacity:0;transition:opacity .3s}
.photo-thumb:hover::after{opacity:1}
.photo-reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.photo-reveal.visible{opacity:1;transform:none}

/* ── LIGHTBOX ── */
.lightbox{position:fixed;inset:0;background:rgba(12,18,26,.97);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column}
.lightbox.open{display:flex;animation:fadeIn .25s ease}
.lb-img{max-width:90vw;max-height:82vh;object-fit:contain;border-radius:6px;transition:opacity .22s ease}
.lb-close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.lb-close:hover{background:rgba(255,255,255,.2);color:white}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.7);width:52px;height:52px;border-radius:50%;cursor:pointer;font-size:1.6rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.lb-nav:hover{background:rgba(255,255,255,.18);color:white}
.lb-prev{left:18px}.lb-next{right:18px}
.lb-counter{margin-top:1.2rem;font-size:.75rem;color:rgba(255,255,255,.3);letter-spacing:.1em}

.empty{text-align:center;padding:8rem 2rem;color:rgba(255,255,255,.2)}
.empty h2{font-family:'DM Serif Display',serif;font-size:2rem;margin-bottom:.8rem}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="./index.html">🛁 Drummond Bathroom Renovations</a>
  <div style="display:flex;align-items:center;gap:1.5rem">
    <a href="./index.html" class="nav-back">← Back</a>
    <a href="./index.html" class="nav-cta">Get a Quote</a>
  </div>
</nav>

<div class="reno-hero">
  <div class="reno-eyebrow">Our Work</div>
  <h1>Bathrooms built<br>to <em>last.</em></h1>
  <p>A selection of recent renovations completed across South Australia by Luke Drummond.</p>
</div>

<main>
  <div id="gallery"><div class="empty"><h2>Loading…</h2></div></div>
</main>

<div id="lightbox" class="lightbox">
  <button class="lb-close" onclick="lbClose()">✕</button>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
  <img class="lb-img" id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// To add a renovation:
// 1. Drop images in pastRenos/ named:  jobname-1.jpg  jobname-2.jpg  etc.
// 2. Add one entry to JOBS below.
// ═══════════════════════════════════════════════════════════════════════════
const JOBS = [
  // { id: 'brighton-ensuite',   title: 'Brighton Ensuite',          subtitle: 'Brighton SA · 2025' },
  // { id: 'norwood-bathroom',   title: 'Norwood Family Bathroom',   subtitle: 'Norwood SA · 2025' },
];

const IMG_BASE = './pastRenos/';
const IMG_EXTS = ['.jpg','.jpeg','.png','.webp'];
const MAX_IMGS = 20;

function probeJobImages(id){
  return new Promise(resolve=>{
    const found=[];
    function tryNext(n){
      if(n>MAX_IMGS){resolve(found);return;}
      let extIdx=0;
      function tryExt(){
        if(extIdx>=IMG_EXTS.length){found.length>0?resolve(found):tryNext(n+1);return;}
        const src=IMG_BASE+id+'-'+n+IMG_EXTS[extIdx];
        const img=new Image();
        img.onload=()=>{found.push(src);tryNext(n+1);};
        img.onerror=()=>{extIdx++;tryExt();};
        img.src=src;
      }
      tryExt();
    }
    tryNext(1);
  });
}

async function loadGallery(){
  const gallery=document.getElementById('gallery');
  if(!JOBS.length){
    gallery.innerHTML='<div class="empty"><h2>Coming Soon</h2><p style="margin-top:.5rem;font-size:.9rem;color:rgba(255,255,255,.25)">Recent renovations will appear here.</p></div>';
    return;
  }
  gallery.innerHTML='';
  const results=await Promise.all(JOBS.map(async job=>({...job,images:await probeJobImages(job.id)})));
  results.forEach(job=>{
    if(!job.images.length)return;
    const sec=document.createElement('div');
    sec.className='job';
    sec.innerHTML=
      '<div class="job-meta-row">'+
        '<div class="job-title">'+job.title+'</div>'+
        (job.subtitle?'<div class="job-subtitle">'+job.subtitle+'</div>':'')+
      '</div>'+
      '<div class="photo-grid'+(job.images.length<=3?' small':'')+'"></div>';
    gallery.appendChild(sec);
    window._lbJobs=window._lbJobs||{};
    window._lbJobs[job.id]=job.images;
    const grid=sec.querySelector('.photo-grid');
    job.images.forEach((src,idx)=>{
      const thumb=document.createElement('div');
      thumb.className='photo-thumb photo-reveal';
      thumb.innerHTML='<img src="'+src+'" loading="lazy" alt="'+job.title+'" onerror="this.closest(\'.photo-thumb\').style.display=\'none\'">';
      thumb.addEventListener('click',()=>lbOpen(job.id,idx));
      grid.appendChild(thumb);
      // Staggered reveal on scroll
      setTimeout(()=>observer.observe(thumb), idx*60);
    });
  });
  if(!gallery.children.length){
    gallery.innerHTML='<div class="empty"><h2>No Photos Yet</h2></div>';
  }
}

// Intersection observer for reveal animation
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target);}});
},{threshold:.1,rootMargin:'0px 0px -40px 0px'});

// ── Lightbox ──────────────────────────────────────────────────────────────────
let _lbImgs=[],_lbIdx=0;
function lbOpen(jobId,idx){
  _lbImgs=(window._lbJobs||{})[jobId]||[];_lbIdx=idx;lbShow();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function lbShow(){
  const el=document.getElementById('lbImg'),ctr=document.getElementById('lbCounter');
  el.style.opacity='0';
  setTimeout(()=>{el.src=_lbImgs[_lbIdx];el.style.opacity='1';},140);
  ctr.textContent=_lbImgs.length>1?(_lbIdx+1)+' of '+_lbImgs.length:'';
  document.querySelector('.lb-prev').style.visibility=_lbImgs.length>1?'':'hidden';
  document.querySelector('.lb-next').style.visibility=_lbImgs.length>1?'':'hidden';
}
function lbNav(dir){if(_lbImgs.length<2)return;_lbIdx=(_lbIdx+dir+_lbImgs.length)%_lbImgs.length;lbShow();}
function lbClose(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target===document.getElementById('lightbox'))lbClose();});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='ArrowRight')lbNav(1);if(e.key==='ArrowLeft')lbNav(-1);if(e.key==='Escape')lbClose();
});
let _swX=0;
const lb=document.getElementById('lightbox');
lb.addEventListener('touchstart',e=>{_swX=e.touches[0].clientX;},{passive:true});
lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-_swX;if(Math.abs(d)>55)lbNav(d<0?1:-1);});

loadGallery();
</script>
</body>
</html>
