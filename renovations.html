<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previous Renovations — Drummond Bathroom Renovations</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F5EFE6;--slate:#2B3A4A;--terra:#BF7B5E;--sage:#6E9B8C;
  --white:#FFFFFF;--light:#EDE7DC;--dark:#182028;--gold:#C9A96E;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--slate);overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--light)}::-webkit-scrollbar-thumb{background:var(--terra);border-radius:3px}

nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(245,239,230,0.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(43,58,74,0.08);padding:0 2rem;height:62px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:.55rem;font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--slate);text-decoration:none}
.nav-cta{background:var(--terra);color:white;border:none;cursor:pointer;padding:.5rem 1.4rem;border-radius:100px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.88rem;transition:all .2s;text-decoration:none}
.nav-cta:hover{background:#A8644A}
.back-link{color:var(--slate);text-decoration:none;font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:.35rem;opacity:.7;transition:opacity .2s}
.back-link:hover{opacity:1}

main{padding:90px 2rem 5rem;max-width:1100px;margin:0 auto}

.page-header{text-align:center;margin-bottom:3rem}
.page-header h1{font-family:'DM Serif Display',serif;font-size:clamp(2rem,4vw,3rem);color:var(--slate);margin-bottom:.6rem}
.page-header p{color:#7A8A99;font-size:1rem;max-width:480px;margin:0 auto}

/* Job sections */
.job{margin-bottom:4rem}
.job-header{margin-bottom:1.1rem;padding-bottom:.8rem;border-bottom:2px solid var(--light)}
.job-title{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--slate);margin-bottom:.2rem}
.job-meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.82rem;color:#9AABB8}
.job-meta span{display:flex;align-items:center;gap:.3rem}

/* Photo grid */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.7rem}
.photo-grid.large{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.photo-thumb{aspect-ratio:4/3;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--light);position:relative}
.photo-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease;display:block}
.photo-thumb:hover img{transform:scale(1.04)}
.photo-thumb .photo-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(27,40,52,.7));color:white;font-size:.72rem;padding:.5rem .7rem;opacity:0;transition:opacity .2s}
.photo-thumb:hover .photo-label{opacity:1}

/* Before/After pairs */
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.7rem}
.ba-label{position:absolute;top:8px;left:8px;background:rgba(43,58,74,.75);color:white;font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:100px;letter-spacing:.06em;text-transform:uppercase}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.lightbox img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:8px;user-select:none;-webkit-user-drag:none;transition:opacity .25s ease}
.lb-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.12);border:none;color:white;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:white;width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:1.5rem;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb-nav:hover{background:rgba(255,255,255,.25)}
.lb-prev{left:14px}
.lb-next{right:14px}
.lb-counter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:.78rem;pointer-events:none}
.lb-caption{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.8);font-size:.85rem;font-weight:500;white-space:nowrap;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.5)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Empty state */
.empty-state{text-align:center;padding:5rem 2rem;color:#9AABB8}
.empty-state h2{font-family:'DM Serif Display',serif;font-size:1.6rem;margin-bottom:.8rem;color:var(--slate);opacity:.5}

@media(max-width:600px){
  .ba-grid{grid-template-columns:1fr}
  .photo-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .lb-nav{width:38px;height:38px;font-size:1.1rem}
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="./index.html">🛁 Drummond Bathroom Renovations</a>
  <div style="display:flex;align-items:center;gap:1rem">
    <a href="./index.html" class="back-link">← Back</a>
    <a href="./index.html" class="nav-cta" onclick="setTimeout(()=>document.querySelector('.btn-primary')?.click(),300);return true">Get a Quote</a>
  </div>
</nav>

<main>
  <div class="page-header">
    <h1>Previous Renovations</h1>
    <p>A selection of recent bathroom renovations completed by Luke Drummond across South Australia.</p>
  </div>

  <div id="jobsContainer">
    <!-- ════════════════════════════════════════════════════════
         ADD JOBS BELOW — copy a job block to add a new one
         ════════════════════════════════════════════════════════

    EXAMPLE JOB WITH BEFORE/AFTER:

    <div class="job">
      <div class="job-header">
        <div class="job-title">Brighton Ensuite Renovation</div>
        <div class="job-meta">
          <span>📍 Brighton, SA</span>
          <span>📅 March 2025</span>
          <span>🪟 12m²</span>
        </div>
      </div>
      <div class="ba-grid">
        <div class="photo-thumb" onclick="openLightbox('brightone-ensuite', 0)">
          <img src="./pastRenos/brighton-ensuite/before-1.jpg" loading="lazy" alt="Before">
          <div class="ba-label">Before</div>
        </div>
        <div class="photo-thumb" onclick="openLightbox('brighton-ensuite', 1)">
          <img src="./pastRenos/brighton-ensuite/after-1.jpg" loading="lazy" alt="After">
          <div class="ba-label">After</div>
        </div>
      </div>
      <div class="photo-grid">
        <div class="photo-thumb" onclick="openLightbox('brighton-ensuite', 2)">
          <img src="./pastRenos/brighton-ensuite/after-2.jpg" loading="lazy" alt="Detail">
          <div class="photo-label">Shower detail</div>
        </div>
        <div class="photo-thumb" onclick="openLightbox('brighton-ensuite', 3)">
          <img src="./pastRenos/brighton-ensuite/after-3.jpg" loading="lazy" alt="Detail">
        </div>
      </div>
    </div>

    ════════════════════════════════════════════════════════ -->

    <!-- Empty state — remove this once you add jobs above -->
    <div class="empty-state">
      <h2>Coming Soon</h2>
      <p>Photos from completed renovations will appear here.<br>Edit <strong>renovations.html</strong> to add your first job.</p>
    </div>

  </div>
</main>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" style="display:none">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-counter" id="lbCounter"></div>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script>
// ── Lightbox ──────────────────────────────────────────────────────────────────
// Each job registers itself: registerJob('job-id', [ {src, label?}, ... ])
const _jobs = {};

function registerJob(id, images) {
  _jobs[id] = images;
}

let _lbJob = null, _lbIdx = 0;

function openLightbox(jobId, idx) {
  _lbJob = jobId;
  _lbIdx = idx;
  showLbImage();
  const lb = document.getElementById('lightbox');
  lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function showLbImage() {
  const imgs = _jobs[_lbJob];
  if (!imgs) return;
  const item = imgs[_lbIdx];
  const imgEl = document.getElementById('lbImg');
  const counter = document.getElementById('lbCounter');
  const caption = document.getElementById('lbCaption');
  imgEl.style.opacity = '0';
  setTimeout(() => {
    imgEl.src = typeof item === 'string' ? item : item.src;
    imgEl.style.opacity = '1';
    counter.textContent = (_lbIdx + 1) + ' / ' + imgs.length;
    caption.textContent = (typeof item === 'object' && item.label) ? item.label : '';
  }, 150);
  // Show/hide nav
  document.querySelector('.lb-prev').style.display = imgs.length > 1 ? 'flex' : 'none';
  document.querySelector('.lb-next').style.display = imgs.length > 1 ? 'flex' : 'none';
}

function lbNav(dir) {
  const imgs = _jobs[_lbJob];
  if (!imgs || imgs.length < 2) return;
  _lbIdx = (_lbIdx + dir + imgs.length) % imgs.length;
  showLbImage();
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.body.style.overflow = '';
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (lb.style.display === 'none') return;
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'Escape') closeLightbox();
});

// Click backdrop to close
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});

// Swipe support
let _lbSwipeX = 0;
const lb = document.getElementById('lightbox');
lb.addEventListener('touchstart', e => { _lbSwipeX = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', e => {
  const delta = e.changedTouches[0].clientX - _lbSwipeX;
  if (Math.abs(delta) > 60) lbNav(delta < 0 ? 1 : -1);
});

// ── HOW TO ADD A JOB ────────────────────────────────────────────────────────
//
// 1. Add a folder to pastRenos/ e.g. pastRenos/norwood-2025/
// 2. Drop your photos in that folder
// 3. In #jobsContainer above, copy the example block and fill in:
//    - Job title, location, date, size
//    - Image paths like ./pastRenos/norwood-2025/after-1.jpg
//    - Register the job at the bottom of this script:
//
// registerJob('norwood-2025', [
//   { src: './pastRenos/norwood-2025/before-1.jpg', label: 'Before' },
//   { src: './pastRenos/norwood-2025/after-1.jpg',  label: 'After' },
//   { src: './pastRenos/norwood-2025/after-2.jpg',  label: 'Shower' },
// ]);
//
// The onclick on each photo-thumb should match: openLightbox('norwood-2025', 0)
//                                                                              ^ index in array above

</script>
</body>
</html>
