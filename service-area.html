<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Area — Drummond Bathroom Renovations</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F5EFE6;--slate:#2B3A4A;--terra:#BF7B5E;--sage:#6E9B8C;--dark:#1A2430;--light:#EDE7DC}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:white;display:grid;grid-template-rows:62px 1fr;grid-template-columns:380px 1fr}

/* Nav */
nav{grid-column:1/-1;grid-row:1;background:rgba(26,36,48,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;z-index:300}
.nav-logo{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--cream);text-decoration:none;opacity:.9}
.nav-right{display:flex;align-items:center;gap:1.2rem}
.nav-back{color:rgba(255,255,255,.45);text-decoration:none;font-size:.82rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;transition:color .2s}
.nav-back:hover{color:var(--terra)}
.nav-cta{background:var(--terra);color:white;padding:.45rem 1.2rem;border-radius:100px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.83rem;text-decoration:none}

/* Sidebar */
.sidebar{grid-column:1;grid-row:2;overflow-y:auto;padding:2rem 1.5rem;border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:1.5rem}
.sidebar-header{margin-bottom:.5rem}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-bottom:.6rem}
.sidebar h1{font-family:'DM Serif Display',serif;font-size:1.9rem;line-height:1.1;color:white;letter-spacing:-.02em;margin-bottom:.5rem}
.sidebar h1 em{color:var(--terra);font-style:italic}
.sidebar p{font-size:.88rem;color:rgba(255,255,255,.4);line-height:1.6}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.stat-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:.8rem 1rem}
.stat-v{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--terra);line-height:1}
.stat-l{font-size:.65rem;color:rgba(255,255,255,.35);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-top:.2rem}

/* Suburb chips */
.chips-label{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:.25rem .75rem;font-size:.76rem;color:rgba(255,255,255,.5);cursor:pointer;transition:all .2s}
.chip:hover,.chip.active{background:rgba(191,123,94,.18);border-color:rgba(191,123,94,.5);color:var(--terra)}
.chip.loading{animation:chipPulse 1.2s ease-in-out infinite}
@keyframes chipPulse{0%,100%{opacity:.4}50%{opacity:.9}}

/* CTA */
.sidebar-cta{background:var(--terra);color:white;border:none;border-radius:12px;padding:.85rem 1rem;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;display:block;text-align:center;transition:background .2s;margin-top:auto}
.sidebar-cta:hover{background:#a86445}

/* Map */
#map{grid-column:2;grid-row:2;width:100%;height:100%}

/* Custom markers */
.dot-marker{border-radius:50%;background:var(--terra);border:2.5px solid white;box-shadow:0 0 0 4px rgba(191,123,94,.25),0 2px 10px rgba(0,0,0,.5);transition:all .25s ease}
.dot-sm{width:12px;height:12px}
.dot-lg{width:22px;height:22px;border-width:3px;box-shadow:0 0 0 7px rgba(191,123,94,.3),0 4px 20px rgba(0,0,0,.6)}

/* Tooltip */
.leaflet-tooltip{background:rgba(20,30,42,.97);border:1px solid rgba(255,255,255,.12);color:white;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;padding:.35rem .75rem;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.leaflet-tooltip::before{display:none}
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom a{background:rgba(26,36,48,.9)!important;color:white!important;border-color:rgba(255,255,255,.1)!important}
.leaflet-control-zoom a:hover{background:rgba(191,123,94,.4)!important}

@media(max-width:700px){
  body{grid-template-columns:1fr;grid-template-rows:62px auto 1fr}
  .sidebar{grid-column:1;grid-row:2;max-height:220px;overflow-y:auto;border-right:none;border-bottom:1px solid rgba(255,255,255,.07);padding:1rem}
  .sidebar h1{font-size:1.3rem}
  #map{grid-column:1;grid-row:3}
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="./index.html">🛁 Drummond Bathroom Renovations</a>
  <div class="nav-right">
    <a href="./index.html" class="nav-back">← Back</a>
    <a href="./index.html" class="nav-cta">Get a Quote</a>
  </div>
</nav>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="eyebrow">Service Area</div>
    <h1>Where we<br><em>work.</em></h1>
    <p>Luke services greater Adelaide and surrounding regions. Tap a suburb to zoom in.</p>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-v" id="statCount">—</div>
      <div class="stat-l">Suburbs</div>
    </div>
    <div class="stat-box">
      <div class="stat-v" id="statFound">—</div>
      <div class="stat-l">Mapped</div>
    </div>
  </div>

  <div>
    <div class="chips-label">Areas served</div>
    <div class="chips" id="chips"></div>
  </div>

  <a href="./index.html" class="sidebar-cta">Get a Free Quote</a>
</aside>

<div id="map"></div>

<script>
// ─────────────────────────────────────────────────────────────
// ADD / REMOVE SUBURBS HERE
// ─────────────────────────────────────────────────────────────
const SUBURBS = [
  "Palmer",
  "Bedford Park",
  "Sturt",
  "Strathalbyn",
  "Smithfield Plains",
  "Huntfield Heights",
  "Underdale",
  "Pooraka",
];

// ─── Map init ─────────────────────────────────────────────────
const map = L.map('map', {
  center: [-35.0, 138.75],
  zoom: 10,
  zoomControl: true,
  attributionControl: false,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19,
}).addTo(map);

function makeIcon(large) {
  const s = large ? 22 : 12;
  return L.divIcon({
    className: '',
    html: `<div class="dot-marker ${large?'dot-lg':'dot-sm'}"></div>`,
    iconSize: [s, s],
    iconAnchor: [s/2, s/2],
    tooltipAnchor: [s/2 + 5, 0],
  });
}

// ─── Build chips immediately ───────────────────────────────────
const chipsEl = document.getElementById('chips');
document.getElementById('statCount').textContent = SUBURBS.length;

SUBURBS.forEach(name => {
  const chip = document.createElement('div');
  chip.className = 'chip loading';
  chip.textContent = name;
  chip.id = 'chip-' + name.replace(/\s+/g,'-');
  chipsEl.appendChild(chip);
});

// ─── Geocode ──────────────────────────────────────────────────
const markerMap = {};
let found = 0;

async function geocode(suburb) {
  const q = encodeURIComponent(suburb + ', South Australia, Australia');
  const res = await fetch(
    `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=au`,
    { headers: { 'User-Agent': 'DrummondBathroomsServiceArea/1.0' } }
  );
  const data = await res.json();
  if (data?.[0]) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
  return null;
}

async function loadAll() {
  const bounds = [];
  for (const suburb of SUBURBS) {
    const chip = document.getElementById('chip-' + suburb.replace(/\s+/g,'-'));
    try {
      const pos = await geocode(suburb);
      if (pos) {
        const marker = L.marker(pos, { icon: makeIcon(false) })
          .bindTooltip(suburb, { permanent: false, direction: 'right' })
          .addTo(map);
        markerMap[suburb] = { marker, pos };
        bounds.push(pos);
        found++;
        document.getElementById('statFound').textContent = found;
        if (chip) {
          chip.classList.remove('loading');
          chip.addEventListener('click', () => {
            // Deactivate all
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            // Enlarge this marker, shrink others
            Object.entries(markerMap).forEach(([n, {marker}]) => {
              marker.setIcon(makeIcon(n === suburb));
            });
            map.flyTo(pos, 13, { duration: 0.8 });
          });
        }
      } else {
        if (chip) { chip.classList.remove('loading'); chip.style.opacity = '.3'; }
      }
    } catch(e) {
      if (chip) { chip.classList.remove('loading'); chip.style.opacity = '.3'; }
    }
    await new Promise(r => setTimeout(r, 1100));
  }
  if (bounds.length > 1) map.fitBounds(bounds, { padding: [50, 50] });
  else if (bounds.length === 1) map.setView(bounds[0], 12);
}

loadAll();
</script>
</body>
</html>
